; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41_eth]
platform = teensy
board = teensy41
framework = arduino
; lib_deps pinned to the exact versions this firmware was built and tested with
lib_deps = 
	https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
	stm32duino/STM32duino LSM6DSV16X@2.0.3
board_microros_distro = jazzy
board_microros_transport = native_ethernet
board_microros_user_meta = teensy41_eth.meta